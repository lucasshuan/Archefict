packages:
  - apps/*
  - packages/*

# --- Supply chain (see docs/stack.md, hard rules) ---
nodeLinker: isolated
# Never resolve a version published less than 3 days ago (minutes). Non-strict: for ranges pnpm picks the
# newest mature version instead of failing. Strict mode fails on every fresh transitive publish, which is daily.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: false
# Lifecycle scripts do not run unless the package is listed here.
strictDepBuilds: true
allowBuilds:
  # cbor-x falls back to pure JS without its native helper; never run its build.
  cbor-extract: false
  lefthook: true
# No git/tarball/URL sub-dependencies.
blockExoticSubdeps: true

# --- Single source of truth for versions. Packages reference "catalog:". ---
catalog:
  # language / tooling
  typescript: 7.0.2
  "@biomejs/biome": 2.5.12
  turbo: 2.10.12
  "@types/node": 26.4.1
  lefthook: 2.1.12
  # test
  vitest: 4.1.11
  fast-check: 4.9.0
  # web
  vite: 8.2.2
  vite-plugin-solid: 2.11.14
  lucide-solid: 1.39.0
  solid-js: 1.9.15
  marked: 18.0.11
  dompurify: 3.4.14
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  # data
  zod: 4.5.4
  "@automerge/automerge": 3.4.1
  "@automerge/automerge-repo": 2.5.6
  "@automerge/automerge-repo-storage-indexeddb": 2.5.6
  "@automerge/automerge-repo-network-broadcastchannel": 2.5.6
  # api
  hono: 4.13.5
  "@hono/node-server": 2.1.1
  "@orpc/server": 1.15.0
  "@orpc/client": 1.15.0
  "@orpc/contract": 1.15.0
  "@orpc/openapi": 1.15.0
  "@orpc/zod": 1.15.0
  # ai
  ai: 7.0.92
  "@openrouter/ai-sdk-provider": 3.0.0
